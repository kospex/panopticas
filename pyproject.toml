[build-system]
requires = ["setuptools>=76.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panopticas"
version = "0.0.23"
description = "The panopticas file type and CLI tool."
authors = [{ name = "Peter Freiberg", email = "peter@kospex.io" }]
dependencies = [
    "Click>=8.3.3",
    "pathspec>=1.0.0",
    "rich>=14.0.0",
]
requires-python = ">=3.12"
readme = "README.md"
keywords = ["analytics", "git"]
license = "MIT"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
panopticas = "panopticas.cli:cli"

# Package only panopticas. Without this, setuptools' automatic discovery for a
# src/ layout packages every directory under src/, and adds any py.typed or
# .pyi files it finds there. The fixtures were under src/tests/ when that
# shipped them in 0.0.22 (#95); they are now in tests/fixtures/ (#99).
[tool.setuptools.packages.find]
where = ["src"]
include = ["panopticas*"]

[project.urls]
Homepage = "https://panopticas.io"
Issues = "https://github.com/kospex/panopticas/issues"
Repository = "https://github.com/kospex/panopticas"
